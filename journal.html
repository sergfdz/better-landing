<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Journal — Bet-ter</title>
  <meta name="description" content="Building Bet-ter in public, day by day, for RevenueCat Shipaton 2026." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="wordmark" href="index.html">
        <img src="assets/favicon.svg" alt="" />
        Bet-ter
      </a>
      <nav class="site-nav">
        <a href="journal.html">Journal</a>
        <a href="story.html">Our story</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" style="padding-bottom: 8px;">
      <span class="badge">Building in public · #Shipaton</span>
      <h1 style="font-size: 1.9rem;">The Journal</h1>
      <p class="lede">Every real day of building Bet-ter, in order. Nothing scripted, nothing skipped.</p>
    </section>

    <div id="all-entries"></div>
  </main>

  <footer class="site">
    <div class="wrap">Bet-ter — a free financial accountability companion. Not a diagnosis, not medical advice.</div>
  </footer>

  <script src="entries.js"></script>
  <script>
    const container = document.getElementById("all-entries");

    if (JOURNAL_ENTRIES.length === 0) {
      container.innerHTML = '<p class="empty-state">The first entry is on its way.</p>';
    } else {
      container.innerHTML = JOURNAL_ENTRIES.map(
        (entry) => `
        <article class="card entry" id="${entry.date}">
          <div class="entry-date">${entry.date}</div>
          <h3>${entry.title}</h3>
          ${entry.body.map((p) => `<p>${p}</p>`).join("")}
          ${entry.tags.map((t) => `<span class="tag">${t}</span>`).join("")}
        </article>
      `,
      ).join("");
    }
  </script>
</body>
</html>
